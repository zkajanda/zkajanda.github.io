function chartSVG(xs,series,stacked){
 const W=1000,H=280,L=56,R=12,T=26,B=40,n=xs.length;if(!n)return'';
 const tot=i=>stacked?series.reduce((a,s)=>a+Math.max(0,s.v[i]),0):Math.max(...series.map(s=>s.v[i]));
 const mn=Math.min(0,...series.flatMap(s=>s.v));const mx=Math.max(1,...xs.map((_,i)=>tot(i)));
 const nice=v=>{const p=Math.pow(10,Math.floor(Math.log10(v)));return Math.ceil(v/p/2)*p*2};
 const top=nice(mx),bot=mn<0?-nice(-mn):0,y=v=>T+(top-v)/(top-bot)*(H-T-B);
 const gw=(W-L-R)/n,bw=Math.min(54,(gw*.7)/(stacked?1:series.length));
 let g='';
 for(let k=0;k<=4;k++){const v=bot+(top-bot)*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eee6e0"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${f0(v)}</text>`}
 g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#b9aea9"/>`;
 xs.forEach((x,i)=>{const cx=L+gw*i+gw/2;g+=`<text x="${cx}" y="${H-B+18}" text-anchor="middle" class="ax">${esc(x)}</text>`;
  if(stacked){let acc=0;series.forEach(s=>{const v=Math.max(0,s.v[i]);if(!v)return;const y1=y(acc+v),y0=y(acc);g+=`<rect x="${cx-bw/2}" y="${y1+1}" width="${bw}" height="${Math.max(0,y0-y1-2)}" rx="3" fill="${s.c}"><title>${esc(x)} · ${s.n}: ${f0(v)}</title></rect>`;acc+=v});
   g+=`<text x="${cx}" y="${y(acc)-6}" text-anchor="middle" class="vl">${f0(acc)}</text>`}
  else series.forEach((s,j)=>{const v=s.v[i],bx=cx-bw*series.length/2+bw*j+1,y1=y(Math.max(0,v)),y0=y(Math.min(0,v));
   g+=`<rect x="${bx}" y="${y1}" width="${bw-2}" height="${Math.max(1,y0-y1)}" rx="3" fill="${v<0?'#d98f88':s.c}"><title>${esc(x)} · ${s.n}: ${f0(v)}</title></rect>`;
   if(n*series.length<=18)g+=`<text x="${bx+(bw-2)/2}" y="${v<0?y0+13:y1-5}" text-anchor="middle" class="vl">${f0(v)}</text>`})});
 const leg=series.length>1?`<div class="leg">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`:'';
 return `${leg}<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`}

 const[h,...r]=P;
 if(h==='desi'){const o=+r[0];if(v==null){for(const c in st.car)st.car[c]=st.car[c].filter(x=>x[0]!==o);return}if(v===o)return;if(Object.values(st.car).some(t=>t.some(x=>x[0]===v))){setTimeout(()=>toast('Bu desi zaten var'),100);return}for(const c in st.car)for(const x of st.car[c])if(x[0]===o)x[0]=v;return}
 if(h==='car'){const t2=st.car[r[0]],d=+r[1],i=t2.findIndex(x=>x[0]===d);if(v==null){if(i>=0)t2.splice(i,1)}else if(i>=0)t2[i][1]=v;else t2.push([d,v]);return}
 if(h==='stab'){const t2=st.sites[r[0]].tab,d=+r[1],i=t2.findIndex(x=>x[0]===d);if(v==null){if(i>=0)t2.splice(i,1)}else if(i>=0)t2[i][1]=v;else t2.push([d,v]);return}
 if(h==='vw'){const it=st.sites.VW.vw.items[r[0]];it[r[1]]=v;return}
 if(h==='fat'){const x=st.fat.find(z=>z.id===r[0]);if(x)x[r[1]]=r[1]==='tarih'?parseDate(raw):v;return}
 if(h==='sites'&&r[1]==='hafta'){const S=st.sites[r[0]];if(!S.hafta[r[2]])S.hafta[r[2]]=[S.rows[r[2]][0],S.rows[r[2]][1]];S.hafta[r[2]][+r[3]]=v;return}
 if(h==='top'){const S=st.sites[r[0]];S.top=S.top||{};const it=S.top[r[1]]||(S.top[r[1]]={});it[r[2]]=v;if(Object.values(it).every(x=>x==null))delete S.top[r[1]];return}
 if(h==='vwi'){const it=st.sites.VW.vw.items[r[0]]||(st.sites.VW.vw.items[r[0]]={});it[r[1]]=v;return}
 if(h==='vwset'){st.sites.VW.vw[r[0]]=v??0;return}
 if(h==='tk'||h==='tc'){const o=h==='tk'?(st.tk=st.tk||{}):(st.tc=st.tc||{});if(v==null)delete o[r[0]];else o[r[0]]=v;return}
 if(h==='tcfg'){tCfg()[r[0]]=v??0;return}
 if(h==='tl'){(st.toplu[r[0]]||(st.toplu[r[0]]=[]))[+r[1]]=v;return}
 if(h==='mh'){const H=st.malHist[+r[0]].mal;(H[r[1]]||(H[r[1]]=[]))[+r[2]]=v;return}
 if(h==='mal'){(st.mal[r[0]]||(st.mal[r[0]]=[null,null,null,null]))[+r[1]]=v;return}
 if(h==='prod'&&r[2]==='kod'){st.prod[r[0]].kod[r[3]]=v;return}
 if(h==='u'){st.urun[+r[0]][r[1]]=v;return}
 let o=h==='prod'?st.prod:h==='sites'?st.sites:st;const keys=h==='prod'||h==='sites'?r:P;

function tableAoa(tb){const out=[];for(const tr of tb.querySelectorAll('tr')){if(tr.classList.contains('hidline')||tr.classList.contains('newfat'))continue;const row=[];
 for(const c of tr.children){if(c.classList.contains('hcol')||c.classList.contains('gap')||c.classList.contains('tk'))continue;let v;const ins=[...c.querySelectorAll('input')];
  if(ins.length){v=ins.map(i=>i.value||i.placeholder||'').filter(Boolean).join(' × ')}else v=c.textContent.replace(/[⌫▸▾✓+]/g,'').trim();
  const n=/^-?[\d.]+(,\d+)?%?$/.test(v)&&v!==''&&v.replace(/\D/g,'').length<10?(v.endsWith('%')?+v.slice(0,-1).replace(/\./g,'').replace(',','.')/100:+v.replace(/\./g,'').replace(',','.')):null;
  row.push(n!=null&&!isNaN(n)?n:v);const sp=+c.getAttribute('colspan')||1;for(let i=1;i<sp;i++)row.push('')}
 if(row.some(x=>x!==''))out.push(row)}return out}
